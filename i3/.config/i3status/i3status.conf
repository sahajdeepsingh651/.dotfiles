# i3status config
# Place at ~/.config/i3status/config or ~/.i3status.conf

general {
    output_format = "i3bar"
    colors = true
    color_good = "#a3be8c"
    color_degraded = "#ebcb8b"
    color_bad = "#bf616a"
    interval = 5
}

order += "disk /"
order += "wireless _first_"
order += "ethernet _first_"
order += "battery all"
order += "cpu_usage"
order += "memory"
order += "volume master"
order += "tztime local"

disk "/" {
    format = "  %avail"
    low_threshold = 10
    threshold_type = "percentage_avail"
}

wireless _first_ {
    format_up = "  %essid %quality"
    format_down = "  down"
}

ethernet _first_ {
    format_up = "  %ip"
    format_down = ""
}

battery all {
    format = "%status %percentage %remaining"
    status_chr = ""
    status_bat = ""
    status_full = ""
    status_unk = ""
    low_threshold = 20
    threshold_type = "percentage"
    last_full_capacity = true
}

cpu_usage {
    format = "  %usage"
    degraded_threshold = 75
    max_threshold = 90
}

memory {
    format = "  %percentage_used"
    threshold_degraded = "20%"
    threshold_critical = "10%"
}

volume master {
    format = "  %volume"
    format_muted = "  muted"
    device = "default"
    mixer = "Master"
    mixer_idx = 0
}

tztime local {
    format = "  %a %b %d  %H:%M"
}
